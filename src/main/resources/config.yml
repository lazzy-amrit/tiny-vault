# TinyVault 1.0.4 configuration. Keep this file private: it contains credentials.

# Your Blomp account email and password — the only credentials the plugin
# needs. Auth happens over Blomp's Swift-compatible API (Keystone v3, with a
# v2.0 fallback).
username: ""
password: ""

# Where backups live on Blomp. "auto" (recommended) uses the container named
# after your account email — that's the only container Blomp lets accounts
# write to — with objects under the tinyvault/ prefix inside it.
dir: "auto"

# How many TinyVault-managed ZIP backups to keep on Blomp. Every time a new
# backup finishes uploading, the oldest ones beyond this number are removed
# permanently (Swift has no trash — deletion is real). Unrelated files in the
# container are never touched. Default 3.
limit: 3

# Interval supports minutes or hours: "15m", "4h", or a plain number of
# hours ("24" means 24 hours). Minimum: one minute.
timer: "24h"

# IANA timezone used for backup filenames and /vault date/time output.
# Examples: Asia/Kolkata (India), Asia/Dhaka, Europe/Berlin, UTC.
timezone: "Asia/Kolkata"

# /vault time display AND backup filename style: "24" keeps names like
# backup-2026-10-16_18.44-..., "12" puts AM/PM into the name instead.
# There is no separate filename format option — these two decide everything.
time-format: "24"

# Optional Discord webhook URL. Leave empty to disable announcements: every
# backup start, success and failure is posted as a colored embed.
webhook-url: ""

# When true, skip the periodic timer and back up before shutdown instead.
# A first backup still runs at startup if no successful backup is recorded.
extreme: false

# Extreme-mode shutdown backup is skipped for shorter server sessions.
extreme-min-session-minutes: 30
