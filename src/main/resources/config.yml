# TinyVault configuration.
# Keep this file private: it contains storage credentials.
# NOTE: `timer` only affects the periodic backup scheduling. The value is a
# plain number and is read as HOURS; it defaults to 24 when missing or invalid.

# mode: "s3" is the universal default for standard S3-compatible providers
# (uses server-side CopyObject for the rotation). "s5" is for FileLu S5,
# whose gateway has no working CopyObject and whose deleted objects land in
# FileLu's trash — s5 mode downloads the previous backup locally instead and
# purges trash entries so they don't consume quota.
mode: "s3"

# FileLu S5 endpoint. Regional hosts: https://ap.s5lu.com (Asia Pacific),
# https://us.s5lu.com, https://eu.s5lu.com, https://me.s5lu.com, or the global
# https://s5lu.com.
endpoint: "https://ap.s5lu.com"

# Bucket = the FileLu folder enabled as an S5 bucket
# (file manager -> Edit Folder -> S5 Bucket -> Save).
bucket: ""

# FileLu region. The documented default is "global"; other valid values are
# "us-east", "eu-central", "ap-southeast", "me-central" (per endpoint).
region: "global"

# FileLu S5 uses path-style addressing.
path-style: true

# Hours or minutes between backups. Suffix decides the unit: `m` = minutes,
# `h` = hours ("15m" = every 15 minutes, "4h" = every 4 hours). A plain
# number without suffix is read as hours (older configs keep working):
# `timer: 24` means every 24 hours. Example for fast testing: timer: "15m".
timer: "15m"

# OPTIONAL Discord announcements. Paste your channel's webhook URL here
# (Discord -> Server Settings -> Integrations -> Webhooks -> New Webhook ->
# Copy Webhook URL). Each backup start, success and failure is then posted
# as a colored embed: blue = started, green = done, red = failed. Announcements
# never delay or block a backup, and an unreachable Discord only logs a
# warning. Leave empty to disable.
webhook-url: ""

# EXTREME MODE: true forgets the `timer` limit entirely. No schedule runs;
# instead a backup starts automatically right before the server stops
# (and a running manual backup is always waited for). Sessions shorter than
# `extreme-min-session-minutes` are skipped, so quick start/stop testing
# rounds never trigger backups. A one-time startup backup still happens if
# the bucket has never received a successful backup at all. Default: false.
extreme: false

# Minimum server session length, in minutes, for extreme mode's shutdown
# backup (default 30). Set it equal to how long you actually play before
# restarting.
extreme-min-session-minutes: 30

# IANA timezone used by /vault commands to display dates and times.
# Examples: Asia/Kolkata (India), Asia/Dhaka, Europe/Berlin, America/New_York, UTC.
# Defaults to Asia/Kolkata when missing or invalid.
timezone: "Asia/Kolkata"

# Clock style for /vault command output: "24" for 24-hour format, "12" for
# 12-hour format with AM/PM. Defaults to 24 when missing or invalid.
time-format: "24"

# FileLu account API key (My Account -> API Key -> switch ON). Only used in
# s5 mode: it lets TinyVault purge deleted backups from FileLu's trash after
# rotation, so trash contents don't trigger "storage full". Leave empty to
# skip trash purging.
api-key: ""

# S5 credentials from My Account on filelu.com.
access-key: ""
secret-key: ""
